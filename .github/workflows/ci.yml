name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cookbook_back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cookbook_back-end/go.mod
          cache-dependency-path: cookbook_back-end/go.sum
      - run: go test -p=2 -timeout 120s ./...
      - run: go vet ./...

  frontend:
    name: Frontend checks and browser integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coobook_front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: coobook_front-end/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: cookbook_back-end/go.mod
          cache-dependency-path: cookbook_back-end/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  container:
    name: Container build and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  operations:
    name: Backup tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n scripts/backup-compose.sh scripts/restore-compose.sh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
