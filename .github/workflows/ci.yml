name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cookbook_back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cookbook_back-end/go.mod
          cache-dependency-path: cookbook_back-end/go.sum
      - run: go test -p=2 -timeout 120s ./...
      - run: go vet ./...

  frontend:
    name: Frontend checks and static-host browser integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coobook_front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: coobook_front-end/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: cookbook_back-end/go.mod
          cache-dependency-path: cookbook_back-end/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      - run: npm run e2e
        env:
          E2E_SKIP_BUILD: "1"
          COOKBOOK_E2E_PRIVATE_SNAPSHOT: "1"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      - run: cd .. && docker compose config --quiet
      - run: cd .. && docker compose build
      - name: Caddy and Go API browser integration
        run: node scripts/run-caddy-smoke.mjs --engine docker --frontend-image "${COMPOSE_PROJECT_NAME}-frontend" --backend-image "${COMPOSE_PROJECT_NAME}-cookbook" --browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      - name: Backup actor cold and WAL restore proof
        run: cd .. && python3 -m unittest discover -s scripts -p 'test_backup_actor_restore.py' -v
        env:
          COOKBOOK_RUN_BACKUP_ACTOR_RESTORE: "1"
          COOKBOOK_CONTAINER_ENGINE: docker
          COOKBOOK_BACKUP_ACTOR_IMAGE: cookbook-ci-${{ github.run_id }}-${{ github.run_attempt }}-cookbook

    env:
      COMPOSE_PROJECT_NAME: cookbook-ci-${{ github.run_id }}-${{ github.run_attempt }}

  operations:
    name: Backup tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n scripts/backup-compose.sh scripts/restore-compose.sh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
