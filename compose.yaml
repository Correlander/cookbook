services:
  cookbook:
    build: .
    restart: unless-stopped
    stop_grace_period: 25s
    env_file:
      - path: cookbook_back-end/.env
        required: false
    environment:
      COOKBOOK_ADDR: 0.0.0.0:8000
      COOKBOOK_DATABASE: /data/cookbook.db
      COOKBOOK_MEDIA_DIR: /data/media
    volumes:
      - cookbook-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      cookbook:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 3s

volumes:
  cookbook-data:
