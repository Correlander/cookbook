services:
  cookbook:
    build: .
    restart: unless-stopped
    stop_grace_period: 25s
    env_file:
      - path: .env
        required: false
    environment:
      COOKBOOK_ADDR: 0.0.0.0:8000
      COOKBOOK_DATABASE: /data/cookbook.db
      COOKBOOK_MEDIA_DIR: /data/media
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cookbook-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  cookbook-data:
